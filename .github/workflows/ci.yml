name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      # Root CI validates the actively maintained integration package.
      # Imported projects/ are provenance-preserving source snapshots with
      # independent dependency / lint conventions and must be audited separately.
      - name: Lint native integration code
        run: ruff check src tests scripts
      - name: Test native integration code
        run: pytest -q tests
